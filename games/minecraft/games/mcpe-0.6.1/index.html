<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>Minecraft Pocket Edition 0.6.1</title>
<link rel="manifest" href="manifest.json" />
<style>
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    font-family: system-ui, sans-serif;
    color: #ddd;
  }
  canvas.emscripten { display: block; outline: 0; width: 100vw; height: 100vh; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 10; transition: opacity .35s ease; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .b-inner { text-align: center; padding: 0 24px; }
  #boot h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.01em; }
  #boot p  { font-size: 13px; color: #888; margin: 0; }
  #boot .b-bar { margin-top: 18px; width: min(360px, 70vw); height: 4px; background: #222; border-radius: 999px; overflow: hidden; position: relative; }
  #boot .b-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #22c55e, transparent); animation: ld 1.4s linear infinite; }
  @keyframes ld { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
</style>
</head>
<body>

<div id="boot"><div class="b-inner">
  <h1>Minecraft Pocket Edition 0.6.1</h1>
  <p>Compiling WebAssembly and loading assets…</p>
  <div class="b-bar"></div>
</div></div>

<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<script>
  // Module setup — canvas, input handlers, and boot-overlay teardown.
  var Module = { canvas: document.getElementById('canvas') };
  (function () {
    var c = Module.canvas;
    c.addEventListener('mousedown', function (e) {
      if (!e.isTrusted || document.pointerLockElement || window.mcMenuOpen) return;
      c.requestPointerLock();
    });
    c.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchstart', function (e) {
      var t = e.target.tagName;
      if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') e.preventDefault();
    }, { passive: false });

    var hideBoot = function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('gone');
      setTimeout(function () { b && b.remove(); }, 500);
    };
    var prev = Module.onRuntimeInitialized;
    Module.onRuntimeInitialized = function () {
      if (prev) try { prev(); } catch (_) {}
      setTimeout(hideBoot, 800);
    };
    setTimeout(hideBoot, 25000); // safety net
  })();
</script>

<!-- Native HTTPS fetch path: streaming WASM compile + parallel asset download. -->
<script async src="index.js"></script>

</body>
</html>
