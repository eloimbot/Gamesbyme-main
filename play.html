<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — The Shelf</title>
<style>
  html, body { margin: 0; height: 100%; background: #211A2E; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  .back { position: fixed; top: 10px; left: 10px; z-index: 10;
          background: rgba(0,0,0,0.6); color: #EFE8DA; padding: 6px 12px;
          border-radius: 6px; text-decoration: none; font-family: sans-serif; font-size: 0.85rem; }
  .back:hover { background: rgba(0,0,0,0.8); }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; Shelf</a>
  <iframe id="frame" allowfullscreen></iframe>

  <!-- GLOBAL SCRIPT LOAD (INCLUDES CLOAK & GAME LOADER) -->
  <script src="script.js"></script>

  <script>
    // 1. GAME URL LOAD LOGIC
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');
    const frame = document.getElementById('frame');

    if (src && frame) {
      frame.src = decodeURIComponent(src);
    }

    // 2. ULTIMATE PANIC SWITCH (HANDLES MAIN WINDOW & IFRAME FOCUS)
    function triggerPanic(e) {
      if (e.code === 'Backquote' || e.key === '~') {
        window.location.href = 'https://docs.google.com';
      }
    }

    // Listen on main window
    window.addEventListener('keydown', triggerPanic);

    // Listen inside iframe when it loads to beat focus lockout
    frame.addEventListener('load', () => {
      try {
        frame.contentWindow.addEventListener('keydown', triggerPanic);
      } catch (err) {
        // Cross-origin fallback: focus parent window on click
        window.focus();
      }
    });
  </script>
</body>
</html>
